<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>Vasty</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0b0f;
        color: #ffffff;
      }
      body {
        position: relative;
      }
      /* Full-screen looping video background */
      .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 0;
        pointer-events: none;
        filter: brightness(0.6); /* Darken slightly so links stand out */
      }
      /* Center layout shell */
      .viewer-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 0 24px 32px;
        z-index: 1;
      }
      .links {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .links a {
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: color 0.2s ease, text-shadow 0.2s ease;
      }
      .links a:hover {
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      }
      .links span {
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <!-- Full-screen background video loop -->
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="joker--going-to-prison-pixel-art.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <main class="viewer-shell">
      <nav class="links" aria-label="Social links">
        <a href="https://discord.com/users/1418221224261193889" target="_blank" rel="noreferrer">Discord</a>
        <span aria-hidden="true">•</span>
        <a href="./l/" target="_blank" rel="noreferrer">Luqa</a>
        <span aria-hidden="true">•</span>
        <a href="https://github.com/l-alagha2502" target="_blank" rel="noreferrer">Github</a>
      </nav>
    </main>
  </body>
</html>
