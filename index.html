<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>Vast — Tools by Luqa</title>
    <meta name="description" content="Explore free web tools made by Luqa" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #000000;
        color: #ffffff;
      }
      
      /* Main layout container */
      .hub-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 60px 80px;
      }

      /* Left side: Vertical stacked typewriter tools */
      .tools-nav {
        display: flex;
        gap: 40px;
        align-items: flex-start;
      }

      .vertical-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #ffffff;
        font-size: 2.8rem;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 2px;
        transition: color 0.2s ease, text-shadow 0.2s ease;
      }

      .vertical-link span {
        display: block;
        text-align: center;
        text-transform: uppercase;
      }

      .vertical-link:hover {
        color: #38bdf8;
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      }

      /* Right side: Smaller secondary links */
      .secondary-nav {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: flex-end;
      }

      .secondary-nav a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 400;
        transition: color 0.2s ease;
      }

      .secondary-nav a:hover {
        color: #ffffff;
      }

      /* Responsive fallback for smaller screens */
      @media(max-width: 900px) {
        .hub-container {
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          gap: 40px;
          padding: 30px;
        }
        .tools-nav {
          flex-wrap: wrap;
          gap: 20px;
        }
        .vertical-link {
          font-size: 1.8rem;
        }
        .secondary-nav {
          align-items: flex-start;
          flex-direction: row;
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="hub-container">
      <!-- Left Section: Vertical Stacked Tools -->
      <nav class="tools-nav" aria-label="Main Tools">
        <a href="https://mawaqit.vastx.app" class="vertical-link" data-text="MAWAQIT">MAWAQIT</a>
        <a href="https://draft.vastx.app" class="vertical-link" data-text="DRAFT">DRAFT</a>
        <a href="https://scribe.vastx.app" class="vertical-link" data-text="SCRIBE">SCRIBE</a>
        <a href="https://kxk.vastx.app" class="vertical-link" data-text="KXK">KXK</a>
      </nav>

      <!-- Right Section: Smaller Links -->
      <nav class="secondary-nav" aria-label="Secondary Links">
        <a href="https://lqmn.page" target="_blank" rel="noreferrer">My Portfolio</a>
        <a href="https://github.com/l-alagha2502" target="_blank" rel="noreferrer">My Github</a>
      </nav>
    </main>

    <script>
      // Clean typewriter letter stack transformation
      document.querySelectorAll('.vertical-link').forEach(link => {
        const text = link.getAttribute('data-text');
        link.innerHTML = text.split('').map(char => `<span>${char === ' ' ? '&nbsp;' : char}</span>`).join('');
      });
    </script>
  </body>
</html>
